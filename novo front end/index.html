<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Biblioteca — Catálogo</title>
  <style>
    :root {
      --azul: #0088ff;
      --azul-escuro: #006fd1;
      --fundo: #e4e8f0;
      --cinza: #d9d9d9;
      --cinza-escuro: #bfc4cc;
      --texto: #1f1f1f;
      --texto-suave: #555;
      --verde: #1e8e3e;
      --vermelho: #c62828;
      --raio: 4px;
      --sombra: 0 2px 8px rgba(0, 0, 0, 0.12);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    [hidden] { display: none !important; }

    body {
      font-family: "Inter", "Segoe UI", Roboto, Arial, sans-serif;
      background: var(--fundo);
      color: var(--texto);
      min-height: 100vh;
    }

    a { color: inherit; }

    .topo {
      background: var(--azul);
      height: 100px;
      padding: 0 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
      color: #fff;
      text-decoration: none;
    }
    .logo-circulo {
      width: 68px;
      height: 68px;
      border-radius: 50%;
      flex-shrink: 0;
      display: block;
      object-fit: contain;
    }
    .logo-textos {
      min-width: 0;
      font-size: clamp(16px, 2.4vw, 24px);
      line-height: 1.15;
    }
    .logo-nome {
      display: block;
      font-weight: 700;
      color: #0e0000;
      transform: translateY(-2px);
    }
    .logo-escola {
      display: block;
      color: #0e0000;
      font-size: 0.42em;
      font-style: italic;
      line-height: 1;
    }

    .conteudo {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px 16px 40px;
    }

    .barra-busca {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 22px;
      margin-bottom: 18px;
      color: #0e0000;
    }

    .campo-busca {
      position: relative;
      grid-column: span 4;
      flex: 1;
      display: flex;
      align-items: center;
      background: var(--cinza);
      border-radius: var(--raio);
      padding: 0 8px;
      color: #0e0000;
    }

    .icone-lupa { flex-shrink: 0; color: #000; }
    .campo-busca input {
      flex: 1;
      min-width: 0;
      border: none;
      background: transparent;
      padding: 8px 10px;
      font-size: 14px;
      outline: none;
    }
    .campo-busca:focus-within { box-shadow: 0 0 0 2px var(--azul); }

    .btn-filtro {
      background: none;
      border: none;
      cursor: pointer;
      color: #0e0000;
      display: grid;
      place-items: center;
      padding: 2px;
      border-radius: var(--raio);
    }
    .btn-filtro.ativo { color: var(--azul); }

    .painel-filtro {
      position: absolute;
      top: calc(100% + 6px);
      right: 0;
      z-index: 10;
      width: 240px;
      background: #fff;
      border-radius: var(--raio);
      box-shadow: var(--sombra);
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .painel-filtro label {
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 13px;
      font-weight: 600;
    }
    .painel-filtro select {
      padding: 6px;
      border: 1px solid var(--cinza-escuro);
      border-radius: var(--raio);
      font: inherit;
    }

    .btn {
      background: var(--cinza);
      border: none;
      border-radius: var(--raio);
      padding: 8px 0;
      width: 117px;
      font-size: 13px;
      letter-spacing: 0.3px;
      cursor: pointer;
    }
    .btn-primario { background: var(--cinza); color: #0a0000; }
    .barra-busca > .btn-primario {
      grid-column: 5;
      width: 100%;
    }
    .btn-link {
      background: none;
      border: none;
      color: var(--azul);
      cursor: pointer;
      font-size: 13px;
      align-self: flex-start;
    }

    .resultado-info {
      font-size: 14px;
      color: var(--texto-suave);
      margin-bottom: 12px;
    }

    .grade {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 20px 22px;
    }

    .card {
      background: var(--cinza);
      padding: 10px 10px 14px;
      text-decoration: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
      border-radius: 2px;
      transition: transform 0.15s, box-shadow 0.15s;
      cursor: pointer;
    }
    .card:hover {
      transform: translateY(-3px);
      box-shadow: var(--sombra);
    }

    .card-info { display: flex; flex-direction: column; gap: 2px; }
    .card-titulo {
      font-size: 13px;
      line-height: 1.3;
      display: -webkit-box;
      line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .card-autor { font-size: 12px; color: var(--texto-suave); }

    .capa {
      --cor-capa: #1f1f1f;
      aspect-ratio: 2 / 2.5;
      width: 100%;
      background: linear-gradient(135deg, var(--cor-capa), #1f1f1f 140%);
      color: #fff;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 12px;
      overflow: hidden;
    }
    .capa:has(img) { padding: 0; }
    .capa img { width: 100%; height: 100%; object-fit: cover; }
    .capa-titulo { font-size: 15px; font-weight: 700; line-height: 1.2; font-family: Georgia, serif; }
    .capa-autor { font-size: 11px; opacity: 0.85; text-transform: uppercase; letter-spacing: 0.5px; }

    .detalhe-wrap {
      background: transparent;
    }

    .voltar {
      display: inline-block;
      font-size: 14px;
      text-decoration: none;
      color: var(--azul-escuro);
      margin-bottom: 12px;
    }

    .detalhe {
      display: flex;
      gap: 44px;
      align-items: flex-start;
      margin-bottom: 8px;
    }

    .detalhe-capa { width: 210px; flex-shrink: 0; }
    .detalhe-capa .capa { aspect-ratio: 2 / 2.7; }

    .detalhe-dados {
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding-top: 8px;
      font-size: 14px;
    }
    .detalhe-dados div { display: flex; gap: 6px; flex-wrap: wrap; }
    .detalhe-dados dt { text-transform: uppercase; }
    .detalhe-dados dd { font-weight: 600; }

    .status {
      display: inline-block;
      padding: 2px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      color: #fff;
    }
    .status.disponivel { background: var(--verde); }
    .status.indisponivel { background: var(--vermelho); }

    .sinopse {
      background: var(--cinza);
      padding: 10px 12px 18px;
      min-height: 78px;
      margin-bottom: 16px;
    }
    .sinopse h2 {
      font-size: 13px;
      font-weight: 400;
      text-transform: uppercase;
      margin-bottom: 6px;
    }
    .sinopse p { font-size: 14px; line-height: 1.5; }

    .colecao h2 { font-size: 13px; font-weight: 400; text-transform: uppercase; margin: 0 0 14px 4px; }
    .colecao-lista {
      display: grid;
      grid-auto-flow: column;
      grid-auto-columns: minmax(140px, 1fr);
      gap: 18px;
      overflow-x: auto;
      padding-bottom: 8px;
    }
    .colecao-lista .card { min-width: 140px; }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 24px;
      transform: translate(-50%, 20px);
      background: #222;
      color: #fff;
      padding: 10px 18px;
      border-radius: var(--raio);
      font-size: 14px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s, transform 0.2s;
    }
    .toast.visivel { opacity: 1; transform: translate(-50%, 0); }

    @media (max-width: 919px) and (min-width: 701px) {
      .barra-busca { grid-template-columns: repeat(4, minmax(0, 1fr)); }
      .campo-busca { grid-column: span 3; }
      .barra-busca > .btn-primario { grid-column: 4; }
      .grade { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    }

    @media (max-width: 700px) {
      .topo { height: 76px; padding: 0 16px; }
      .logo-circulo { width: 52px; height: 52px; }
      .logo { gap: 10px; }
      .logo-textos { font-size: clamp(14px, 4vw, 18px); }
      .barra-busca { grid-template-columns: 1fr; gap: 10px; }
      .campo-busca { grid-column: 1; min-height: 38px; }
      .barra-busca > .btn-primario { grid-column: 1; }
      .grade { grid-template-columns: repeat(2, 1fr); gap: 14px; }
      .detalhe { flex-direction: column; align-items: center; gap: 20px; }
      .detalhe-dados { align-self: stretch; }
    }
  </style>
</head>
<body>
  <header class="topo">
    <a href="#" class="logo" id="logo-home" aria-label="Página inicial">
      <img class="logo-circulo" src="./logo-biblioteca.png" alt="Logo da biblioteca" />
      <span class="logo-textos">
        <span class="logo-nome">Biblioteca Digital Sílvia Mafra</span>
        <span class="logo-escola">Escola Estadual Humberto de Campos</span>
      </span>
    </a>
  </header>

  <main class="conteudo">
    <section id="catalogo-view">
      <form class="barra-busca" id="form-busca" role="search">
        <div class="campo-busca">
          <svg class="icone-lupa" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
            <circle cx="10" cy="10" r="6.5" fill="none" stroke="currentColor" stroke-width="2.5"/>
            <line x1="15" y1="15" x2="21" y2="21" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
          </svg>
          <input type="search" id="campo-busca" placeholder="Buscar por título, autor ou gênero" aria-label="Buscar livros" />
          <button type="button" class="btn-filtro" id="btn-filtro" aria-label="Filtros" aria-expanded="false" aria-controls="painel-filtro">
            <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
              <path d="M2 3h20l-8 9v8l-4 2V12z" fill="currentColor"/>
            </svg>
          </button>

          <div class="painel-filtro" id="painel-filtro" hidden>
            <label>Gênero
              <select id="filtro-genero">
                <option value="todos">Todos</option>
              </select>
            </label>
            <label>Status
              <select id="filtro-status">
                <option value="todos">Todos</option>
                <option value="disponivel">Disponível</option>
                <option value="indisponivel">Indisponível</option>
              </select>
            </label>
            <button type="button" class="btn btn-link" id="limpar-filtros">Limpar filtros</button>
          </div>
        </div>
        <button type="submit" class="btn btn-primario">BUSCAR</button>
      </form>

      <p class="resultado-info" id="resultado-info" aria-live="polite"></p>
      <section class="grade" id="grade-livros" aria-label="Catálogo de livros"></section>
    </section>

    <section id="detalhe-view" class="detalhe-wrap" hidden>
      <a href="#" class="voltar" id="voltar-catalogo">← Voltar ao catálogo</a>

      <article id="detalhe-livro">
        <section class="detalhe">
          <div class="detalhe-capa" id="detalhe-capa"></div>
          <dl class="detalhe-dados">
            <div><dt>Título:</dt><dd id="d-titulo"></dd></div>
            <div><dt>Autor:</dt><dd id="d-autor"></dd></div>
            <div><dt>Gênero:</dt><dd id="d-genero"></dd></div>
            <div><dt>Data:</dt><dd id="d-data"></dd></div>
            <div><dt>Páginas:</dt><dd id="d-paginas"></dd></div>
            <div><dt>Status:</dt><dd><span class="status" id="d-status"></span></dd></div>
          </dl>
        </section>

        <section class="sinopse">
          <h2>Sinopse:</h2>
          <p id="d-sinopse"></p>
        </section>

        <section class="colecao">
          <h2 id="d-colecao-nome">Coleção</h2>
          <div class="colecao-lista" id="colecao-lista"></div>
        </section>
      </article>
    </section>
  </main>

  <script>
    window.API_BASE = window.location.origin;
    window.COR_PALETTE = ["#7b4b2a", "#2f4858", "#4a3f6b", "#2e6f40", "#b5651d", "#a23b5c", "#3d5a80", "#5c7a29", "#6b4f8a", "#c0392b", "#1f7a8c", "#8d6e63"];

    const catalogoView = document.getElementById("catalogo-view");
    const detalheView = document.getElementById("detalhe-view");
    const grade = document.getElementById("grade-livros");
    const info = document.getElementById("resultado-info");
    const formBusca = document.getElementById("form-busca");
    const campoBusca = document.getElementById("campo-busca");
    const btnFiltro = document.getElementById("btn-filtro");
    const painelFiltro = document.getElementById("painel-filtro");
    const filtroGenero = document.getElementById("filtro-genero");
    const filtroStatus = document.getElementById("filtro-status");

    function toast(mensagem) {
      let el = document.querySelector(".toast");
      if (!el) {
        el = document.createElement("div");
        el.className = "toast";
        el.setAttribute("role", "status");
        document.body.appendChild(el);
      }
      el.textContent = mensagem;
      el.classList.add("visivel");
      clearTimeout(el._timer);
      el._timer = setTimeout(() => el.classList.remove("visivel"), 3000);
    }

    function normalizarLivro(livro) {
      const colecoes = Array.isArray(livro.colecoes)
        ? livro.colecoes.filter(Boolean)
        : [livro.nome_colecao].filter(Boolean);
      const generos = Array.isArray(livro.generos)
        ? livro.generos.filter(Boolean)
        : [livro.nome_genero].filter(Boolean);
      const id = Number(livro.id || 0);
      const status = String(livro.status || "indisponivel").toLowerCase();

      return {
        ...livro,
        id,
        titulo: livro.titulo || "Livro sem título",
        autor: livro.autor || "Autor desconhecido",
        dataPublicacao: livro.datadepublicacao || "0000-00-00",
        genero: generos[0] || "Sem gênero",
        paginas: Number(livro.paginas) || 0,
        disponivel: status === "disponivel",
        colecao: colecoes[0] || "",
        colecoes,
        generos,
        cor: window.COR_PALETTE[id % window.COR_PALETTE.length],
        sinopse: livro.sinopse || livro.descricao || "Sem sinopse disponível.",
        capaUrl: livro.imagem || "",
      };
    }

    function criarCapa(livro) {
      const capa = document.createElement("div");
      capa.className = "capa";
      capa.style.setProperty("--cor-capa", livro.cor || "#1f1f1f");

      if (livro.capaUrl) {
        const img = document.createElement("img");
        img.src = livro.capaUrl;
        img.alt = `Capa de ${livro.titulo}`;
        capa.appendChild(img);
      } else {
        capa.setAttribute("role", "img");
        capa.setAttribute("aria-label", `Capa de ${livro.titulo}`);
        capa.innerHTML = `<span class="capa-titulo"></span><span class="capa-autor"></span>`;
        capa.querySelector(".capa-titulo").textContent = livro.titulo;
        capa.querySelector(".capa-autor").textContent = livro.autor;
      }

      return capa;
    }

    function criarCard(livro) {
      const card = document.createElement("a");
      card.className = "card";
      card.href = "#";
      card.addEventListener("click", (event) => {
        event.preventDefault();
        abrirDetalhe(livro.id);
      });

      card.appendChild(criarCapa(livro));

      const info = document.createElement("div");
      info.className = "card-info";
      info.innerHTML = `<strong class="card-titulo"></strong><span class="card-autor"></span>`;
      info.querySelector(".card-titulo").textContent = livro.titulo;
      info.querySelector(".card-autor").textContent = livro.autor;
      card.appendChild(info);

      return card;
    }

    async function buscarLivros({ pesquisa = "", genero = "todos", status = "todos" } = {}) {
      const params = new URLSearchParams({ pesquisa: pesquisa || "%", genero, status });
      const resposta = await fetch(`${window.API_BASE}/livros/search?${params.toString()}`);
      if (!resposta.ok) {
        const erro = await resposta.json().catch(() => ({}));
        throw new Error(erro.error || "Erro ao buscar livros.");
      }

      const dados = await resposta.json();
      return Array.isArray(dados) ? dados.map(normalizarLivro) : [];
    }

    async function buscarLivroPorId(id) {
      const resposta = await fetch(`${window.API_BASE}/livros/${encodeURIComponent(id)}`);
      if (!resposta.ok) {
        const erro = await resposta.json().catch(() => ({}));
        throw new Error(erro.error || "Livro não encontrado.");
      }

      return normalizarLivro(await resposta.json());
    }

    function formatarData(iso) {
      if (!iso || iso === "0000-00-00") return "Data indisponível";
      const [ano, mes, dia] = iso.split("-");
      return `${dia}/${mes}/${ano}`;
    }

    async function carregarCatalogo() {
      try {
        const pesquisa = campoBusca.value.trim();
        const genero = filtroGenero.value || "todos";
        const status = filtroStatus.value || "todos";

        const lista = await buscarLivros({ pesquisa, genero, status });
        grade.replaceChildren(...lista.map(criarCard));

        const generos = [...new Set(lista.flatMap((l) => l.generos || []))].sort();
        const valoresAtuais = Array.from(filtroGenero.options).map((op) => op.value);
        for (const generoItem of generos) {
          if (!valoresAtuais.includes(generoItem)) {
            filtroGenero.add(new Option(generoItem, generoItem));
          }
        }

        const filtrosAtivos = Boolean(pesquisa || genero !== "todos" || status !== "todos");
        btnFiltro.classList.toggle("ativo", Boolean(genero !== "todos" || status !== "todos"));
        info.textContent = lista.length === 0
          ? "Nenhum livro encontrado."
          : filtrosAtivos ? `${lista.length} livro(s) encontrado(s).` : "";
      } catch (erro) {
        grade.replaceChildren();
        info.textContent = erro.message || "Não foi possível carregar os livros.";
        toast(info.textContent);
      }
    }

    async function abrirDetalhe(id) {
      try {
        const livro = await buscarLivroPorId(id);
        const detalheCapa = document.getElementById("detalhe-capa");
        detalheCapa.replaceChildren(criarCapa(livro));

        document.getElementById("d-titulo").textContent = livro.titulo;
        document.getElementById("d-autor").textContent = livro.autor;
        document.getElementById("d-genero").textContent = livro.genero;
        document.getElementById("d-data").textContent = formatarData(livro.dataPublicacao);
        document.getElementById("d-paginas").textContent = livro.paginas || "-";
        document.getElementById("d-sinopse").textContent = livro.sinopse;

        const statusEl = document.getElementById("d-status");
        statusEl.textContent = livro.disponivel ? "Disponível" : "Indisponível";
        statusEl.classList.toggle("disponivel", livro.disponivel);
        statusEl.classList.toggle("indisponivel", !livro.disponivel);

        const colecaoNome = document.getElementById("d-colecao-nome");
        colecaoNome.textContent = livro.colecao ? `Coleção — ${livro.colecao}` : "Coleção";

        const colecaoLista = document.getElementById("colecao-lista");
        const todosLivros = await buscarLivros({ pesquisa: "", genero: "todos", status: "todos" });
        const outros = todosLivros.filter((item) => item.id !== livro.id && item.colecao && livro.colecao && item.colecao === livro.colecao);

        colecaoLista.replaceChildren(...(outros.length ? outros.map(criarCard) : [document.createElement("p")]));
        if (!outros.length) {
          colecaoLista.innerHTML = '<p class="vazio">Nenhum outro livro nesta coleção.</p>';
        }

        catalogoView.hidden = true;
        detalheView.hidden = false;
      } catch (erro) {
        toast(erro.message || "Não foi possível abrir o livro.");
      }
    }

    function voltarCatalogo() {
      detalheView.hidden = true;
      catalogoView.hidden = false;
    }

    formBusca.addEventListener("submit", (event) => {
      event.preventDefault();
      carregarCatalogo();
    });

    campoBusca.addEventListener("input", () => {
      carregarCatalogo();
    });

    filtroGenero.addEventListener("change", carregarCatalogo);
    filtroStatus.addEventListener("change", carregarCatalogo);

    document.getElementById("logo-home").addEventListener("click", (event) => {
      event.preventDefault();
      voltarCatalogo();
    });

    document.getElementById("voltar-catalogo").addEventListener("click", (event) => {
      event.preventDefault();
      voltarCatalogo();
    });

    btnFiltro.addEventListener("click", () => {
      painelFiltro.hidden = !painelFiltro.hidden;
      btnFiltro.setAttribute("aria-expanded", String(!painelFiltro.hidden));
    });

    document.addEventListener("click", (event) => {
      if (!painelFiltro.hidden && !painelFiltro.contains(event.target) && !btnFiltro.contains(event.target)) {
        painelFiltro.hidden = true;
        btnFiltro.setAttribute("aria-expanded", "false");
      }
    });

    document.getElementById("limpar-filtros").addEventListener("click", () => {
      filtroGenero.value = "todos";
      filtroStatus.value = "todos";
      carregarCatalogo();
    });

    carregarCatalogo();
  </script>
</body>
</html>
